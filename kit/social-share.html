<style>
  :root { --ink:#111111; --paper:#f7f4ee; --red:#a6192e; --gold:#cba24a; }
  * { box-sizing:border-box; margin:0; }
  body { background:#2a2622; display:grid; place-items:center; min-height:100vh;
         font-family:"Montserrat",sans-serif; padding:24px; gap:18px; }
  .note { color:#cfc6ba; font-size:14px; text-align:center; max-width:60ch; line-height:1.5; }
  .canvas { position:relative; overflow:hidden; background:var(--ink); color:var(--paper);
            box-shadow:0 30px 80px rgba(0,0,0,.45); }
  .canvas img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .scrim { position:absolute; inset:0; }
  .content { position:relative; height:100%; display:flex; flex-direction:column; }
  .logo { height:auto; }
  .headline { font-family:"Graduate",Georgia,serif; font-weight:400; line-height:1.06;
              text-transform:uppercase; letter-spacing:.005em; }
  .gold { color:var(--gold); }
  .script { font-family:"Alex Brush",cursive; color:var(--gold); line-height:1; }
  .cta { background:var(--red); color:#fff; font-weight:700; border-radius:999px;
         display:inline-flex; align-items:center; gap:.5em; }
  .eyebrow { text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--gold); }

  .canvas { width:1200px; height:630px; display:grid; grid-template-columns:1.1fr 1fr; }
  .left { position:relative; overflow:hidden; }
  .left img { width:100%; height:100%; object-fit:cover; }
  .right { background:var(--ink); padding:62px 58px; display:flex; flex-direction:column;
           justify-content:space-between; }
  .logo { width:330px; }
  .headline { font-size:44px; max-width:16ch; }
  .sub { font-size:22px; color:#e8e0d4; margin-top:16px; }
  .domain { font-size:20px; color:var(--gold); letter-spacing:.06em; }
</style></head><body>
